        // ======= STATE MANAGEMENT =======
        let activeTab = 'menu';
        let currentSearchQuery = '';

        // Ganti Tab
        function switchTab(tab) {
            activeTab = tab;
            renderApp();
        }

        // Fungsi pembantu untuk menghitung jumlah item yang cocok dengan pencarian
        function getMatchCount(menuSourceData, searchQuery = '') {
            let count = 0;
            const lowerQuery = searchQuery.toLowerCase();
            menuSourceData.forEach(group => {
                const filtered = group.items.filter(item => 
                    item.title.toLowerCase().includes(lowerQuery) || 
                    item.desc.toLowerCase().includes(lowerQuery)
                );
                count += filtered.length;
            });
            return count;
        }

        // Render Bagian Tab Navigasi
        function renderTabs() {
            const container = document.getElementById('tabs-container');
            
            // Hitung jumlah sub-menu aktif berdasarkan pencarian secara real-time

            const adminCount = getMatchCount(menuAdminData, currentSearchQuery);

            const baseClass = "h-9 px-3 rounded-full font-semibold text-xs md:text-sm flex items-center justify-center gap-2 transition-all duration-200 whitespace-nowrap outline-none border";
            
            // Status Tab Menu GTK
            const gtkActive = activeTab === 'menu';
            const gtkClass = gtkActive 
                ? `${baseClass} bg-brand text-white border-brand shadow-sm` 
                : `${baseClass} bg-white text-gray-600 border-gray-200 hover:bg-gray-50`;
            const gtkBadgeClass = gtkActive 
                ? "ml-1.5 px-2 py-0.5 text-[10px] md:text-xs font-bold rounded-full bg-white text-brand" 
                : "ml-1.5 px-2 py-0.5 text-[10px] md:text-xs font-bold rounded-full bg-gray-100 text-gray-500";

            // Status Tab Menu Admin
            const adminActive = activeTab === 'admin';
            const adminClass = adminActive 
                ? `${baseClass} bg-brand text-white border-brand shadow-sm` 
                : `${baseClass} bg-white text-gray-600 border-gray-200 hover:bg-gray-50`;
            const adminBadgeClass = adminActive 
                ? "ml-1.5 px-2 py-0.5 text-[10px] md:text-xs font-bold rounded-full bg-white text-brand" 
                : "ml-1.5 px-2 py-0.5 text-[10px] md:text-xs font-bold rounded-full bg-gray-100 text-gray-500";

            container.innerHTML = `
                <button onclick="switchTab('menu')" class="${gtkClass}">
                    <i data-lucide="user" class="w-4 h-4"></i>
                    <span>Menu GTK</span>
                    <span class="${gtkBadgeClass}">${gtkCount}</span>
                </button>
                <button onclick="switchTab('admin')" class="${adminClass}">
                    <i data-lucide="shield-check" class="w-4 h-4"></i>
                    <span>Menu Admin</span>
                    <span class="${adminBadgeClass}">${adminCount}</span>
                </button>
            `;
        }

        // Render HTML untuk Daftar Menu berdasarkan Data Sumber & Kata Kunci Pencarian
        function getMenuHTML(menuSourceData, searchQuery = '') {
            let html = '';
            let hasResult = false;
            const lowerQuery = searchQuery.toLowerCase();

            menuSourceData.forEach(group => {
                // Filter item berdasarkan nama menu atau deskripsi
                const filteredItems = group.items.filter(item => 
                    item.title.toLowerCase().includes(lowerQuery) || 
                    item.desc.toLowerCase().includes(lowerQuery)
                );

                if (filteredItems.length > 0) {
                    hasResult = true;
                    html += `
                    <div class="menu-section">
                        <div class="flex items-center gap-2 mb-2 pt-1">
                            <i data-lucide="${group.icon}" class="w-4 h-4 md:w-5 md:h-5 text-brand"></i>
                            <h2 class="text-[13px] md:text-sm font-bold text-gray-800">${group.section}</h2>
                            <span class="bg-brand text-white text-[9px] md:text-xs font-bold px-1.5 py-0.5 rounded-full">${filteredItems.length}</span>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 md:gap-3">
                    `;
                    
                    filteredItems.forEach(item => {
                        const targetUrl = item.url ? item.url : '#';
                        html += `
                            <a href="${targetUrl}" target="_blank" rel="noopener noreferrer" class="bg-white border border-gray-200 rounded-xl p-2.5 md:p-3 flex items-center justify-between hover:border-brand hover:shadow-md transition-all duration-200 cursor-pointer group text-left outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2">
                                <div class="flex items-center gap-2.5 md:gap-3 flex-1 min-w-0">
                                    <div class="w-9 h-9 md:w-10 md:h-10 bg-brand-light text-brand rounded-full flex items-center justify-center shrink-0 group-hover:bg-brand group-hover:text-white transition-colors duration-200">
                                        <i data-lucide="${item.icon}" class="w-4.5 h-4.5 md:w-5 md:h-5"></i>
                                    </div>
                                    <div class="flex flex-col justify-center flex-1 min-w-0">
                                        <h3 class="font-semibold text-gray-800 text-[13px] md:text-sm line-clamp-1 group-hover:text-brand transition-colors duration-200 leading-tight">${item.title}</h3>
                                        <p class="text-[11px] md:text-xs text-gray-500 mt-0.5 leading-tight line-clamp-1">${item.desc}</p>
                                    </div>
                                </div>
                                <div class="text-gray-300 shrink-0 group-hover:text-brand transition-colors duration-200 transform group-hover:translate-x-1 ml-2">
                                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                                </div>
                            </a>
                        `;
                    });
                    html += `</div></div>`;
                }
            });

            // Jika pencarian kosong/tidak membuahkan hasil
            if (!hasResult && searchQuery !== '') {
                html = `
                <div class="text-center py-10">
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-gray-100 text-gray-400 mb-3">
                        <i data-lucide="search-x" class="w-6 h-6"></i>
                    </div>
                    <p class="text-gray-500 font-medium">Tidak ada menu yang cocok dengan pencarian "${searchQuery}"</p>
                </div>`;
            }

            return html;
        }

        // Fungsi Utama untuk merender konten secara dinamis ke container tunggal
        function renderApp() {
            renderTabs();
            
            const mainContainer = document.getElementById('main-container');
            const currentData = activeTab === 'admin' ? menuAdminData : menuData;
            
            mainContainer.innerHTML = getMenuHTML(currentData, currentSearchQuery);
            lucide.createIcons();
        }

        // ======= DOM CONTENT LOADED & EVENTS =======
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();

            // Event Listener Pencarian Data
            document.getElementById('searchInput').addEventListener('input', (e) => {
                currentSearchQuery = e.target.value;
                
                // Update badge counter di tab navigasi secara real-time
                renderTabs();
                
                const currentData = activeTab === 'admin' ? menuAdminData : menuData;
                document.getElementById('main-container').innerHTML = getMenuHTML(currentData, currentSearchQuery);
                lucide.createIcons();
            });
        });

        // ======= SCROLL EVENT UNTUK STICKY HEADER =======
        window.addEventListener('scroll', () => {
            const stickyHeader = document.getElementById('sticky-header');
            if (window.scrollY > 15) {
                stickyHeader.classList.add('shadow-[0_10px_20px_-10px_rgba(0,0,0,0.08)]');
            } else {
                stickyHeader.classList.remove('shadow-[0_10px_20px_-10px_rgba(0,0,0,0.08)]');
            }
        });
    </script>
</body>
</html>
